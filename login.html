<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Signup - English Seekho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/dark-mode.js"></script>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMtL9sDV0wwcTZ-tzGTwU-ChF97iv4dG0",
      authDomain: "english-seekho-leaderboard.firebaseapp.com",
      databaseURL: "https://english-seekho-leaderboard-default-rtdb.firebaseio.com",
      projectId: "english-seekho-leaderboard",
      storageBucket: "english-seekho-leaderboard.firebasestorage.app",
      messagingSenderId: "462760120293",
      appId: "1:462760120293:web:63032ad088865b786c690c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.firebaseAuth = auth;
    window.firebaseCreateUser = createUserWithEmailAndPassword;
    window.firebaseSignIn = signInWithEmailAndPassword;
    window.firebaseOnAuth = onAuthStateChanged;

    console.log('✅ Firebase Auth initialized');
  </script>
</head>

<body>

  <nav class="navbar">
    <div class="logo">📚 English Seekho</div>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="grammar.html">Grammar</a></li>
      <li><a href="vocabulary.html">Vocabulary</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="game.html">Game</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="leaderboard.html">Leaderboard</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" id="navLoginBtn">Login</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <h1>🔐 Apna Account Banayein</h1>
    <p>Login karein taaki aapki progress save rahe!</p>
  </header>

  <main class="login-container">
    <div class="login-card">

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin">Login</button>
        <button class="auth-tab" id="tabSignup">Sign Up</button>
      </div>

      <div class="form-group" id="nameGroup" style="display: none;">
        <label for="authName">Aapka Naam:</label>
        <input type="text" id="authName" placeholder="Apna naam likhein...">
      </div>

      <form id="authForm">
        <div class="form-group">
          <label for="authEmail">Email:</label>
          <input type="email" id="authEmail" placeholder="aapka@email.com" required>
        </div>

        <div class="form-group">
          <label for="authPassword">Password:</label>
          <input type="password" id="authPassword" placeholder="Password daalein..." required>
        </div>

        <button type="submit" class="btn btn-primary" id="authSubmitBtn" style="width:100%;">Login Karein</button>

        <div id="authError" class="auth-error" style="display:none;"></div>
      </form>

    </div>
  </main>

  <footer class="footer">
    <p>© 2025 English Seekho | Made with ❤️</p>
  </footer>

  <script src="js/auth.js"></script>
</body>

</html>
